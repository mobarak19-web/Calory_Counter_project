{% extends 'base.html' %}

{% block content %}
<div class="container mt-4">
    <div class="card">
        <div class="container mt-4">
            <h2>Change password ({{ request.user.username }})</h2>
            
            <form method="post">
                {% csrf_token %}

                {{ form.as_p }}
                <p><button type="submit" class="btn btn-primary mt-3">Change</button></p>
            </form>
        </div>
    </div>
</div>
{% endblock %}
